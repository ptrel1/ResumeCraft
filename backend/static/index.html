<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeCraft · 简历工坊</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg?v=0.1.4">
<style>
  /* ============================================================================
     ResumeCraft 现代 IDE 式工作台架构 (设计心理学重构版)
     1. 统一左侧 Activity Bar + 抽屉 Sidebar (单向空间映射，消除抽屉对撞)
     2. 极简交付顶栏 (降低 Hick's Law 选择瘫痪)
     3. 编辑器 + A4 实时高保真画布三区流线
     4. 沉浸式底部状态栏 (统一状态感知与视口微调)
     ============================================================================ */
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg-dark:#0d1117;
    --panel-dark:#161b22;
    --activity-bar:#090d13;
    --sidebar-bg:#12161f;
    --topbar-bg:#161b22;
    --border-color:#30363d;
    --accent-green:#3fb950;
    --accent-blue:#58a6ff;
    --accent-purple:#bc8cff;
    --text-main:#e6edf3;
    --text-muted:#8b949e;
    --danger:#f85149;
    --statusbar-bg:#090d13;
  }
  body{
    font-family:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg-dark);color:var(--text-main);height:100vh;display:flex;flex-direction:column;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }

  /* ---------- 1. 极简顶栏 (Top Delivery Bar) ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;padding:0 16px;
    background:var(--topbar-bg);border-bottom:1px solid var(--border-color);
    height:44px;flex-shrink:0;z-index:50;
  }
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .topbar-logo{font-weight:800;font-size:15px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;}
  .topbar-logo img{width:22px;height:22px;display:block;}
  .topbar-logo b{color:var(--accent-green);}
  .doc-badge{
    font-size:12px;color:var(--accent-blue);background:rgba(88,166,255,0.1);
    padding:2px 10px;border-radius:12px;border:1px solid rgba(88,166,255,0.25);
    font-family:ui-monospace,monospace;font-weight:600;
  }
  .save-status{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:5px;}
  .save-status .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-green);}

  .topbar-right{display:flex;align-items:center;gap:8px;}
  .btn{
    background:#21262d;color:var(--text-main);border:1px solid var(--border-color);
    border-radius:6px;padding:4px 12px;font-size:12.5px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;transition:all .15s;font-weight:600;
    text-decoration:none;
  }
  .btn:hover{background:#30363d;border-color:#484f58;}
  .btn.primary{background:var(--accent-green);color:#0f1117;border:none;font-weight:700;}
  .btn.primary:hover{filter:brightness(1.1);}

  /* ---------- 2. 主工作区布局 (Activity Bar + Sidebar + Studio) ---------- */
  .workbench{flex:1;display:flex;overflow:hidden;position:relative;}

  /* 2.1 最左侧活动栏 (Activity Bar: 48px) */
  .activity-bar{
    width:48px;background:var(--activity-bar);border-right:1px solid var(--border-color);
    display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:8px;
    flex-shrink:0;z-index:40;
  }
  .act-item{
    width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);cursor:pointer;transition:all .15s;position:relative;font-size:16px;
    background:transparent;border:none;
  }
  .act-item:hover{color:var(--text-main);background:#1c212c;}
  .act-item.active{color:var(--text-main);background:#21262d;}
  .act-item.active::before{
    content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--accent-green);
    border-radius:0 2px 2px 0;
  }

  /* 2.2 统一多功能侧边栏 (Sidebar: 320px) */
  .sidebar{
    width:320px;background:var(--sidebar-bg);border-right:1px solid var(--border-color);
    display:flex;flex-direction:column;flex-shrink:0;transition:width .2s cubic-bezier(0.2,0,0,1);
    position:relative;overflow:hidden;
  }
  .sidebar.collapsed{width:0;border-right:none;}
  .sidebar-head{
    padding:10px 14px;border-bottom:1px solid var(--border-color);display:flex;
    justify-content:space-between;align-items:center;height:40px;flex-shrink:0;
  }
  .sidebar-head h3{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}
  .sidebar-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}

  /* 侧边栏子卡片样式 */
  .side-card{
    background:#161b22;border:1px solid var(--border-color);border-radius:8px;
    padding:10px 12px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:5px;
  }
  .side-card:hover{border-color:var(--accent-blue);background:#1c2230;}
  .side-card.active{border-color:var(--accent-green);background:#16241f;}
  .side-card-title{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
  .side-card-meta{font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between;}
  .side-actions{display:flex;gap:6px;margin-top:4px;}
  .side-btn{
    background:#21262d;border:none;border-radius:4px;color:var(--text-main);
    font-size:11px;padding:3px 8px;cursor:pointer;
  }
  .side-btn:hover{background:var(--accent-blue);color:#fff;}
  .side-btn.del:hover{background:var(--danger);color:#fff;}
  .side-btn.pub:hover{background:var(--accent-green);color:#0f1117;}
  .pub-badge{
    font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:8px;
    display:inline-block;vertical-align:middle;
  }
  .pub-badge.on{background:rgba(63,185,80,0.15);color:var(--accent-green);border:1px solid rgba(63,185,80,0.3);}
  .pub-badge:not(.on){background:rgba(139,148,158,0.12);color:var(--text-muted);border:1px solid var(--border-color);}

  /* 2.3 双栏核心工坊 (Editor + Preview Canvas) */
  .workspace{flex:1;display:flex;overflow:hidden;background:#0d1117;}
  .panel{height:100%;display:flex;flex-direction:column;overflow:hidden;}

  /* 左侧编辑器 */
  .editor-panel{width:46%;border-right:1px solid var(--border-color);}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;background:#131720;border-bottom:1px solid var(--border-color);
    font-size:12px;color:var(--text-muted);font-weight:600;height:36px;flex-shrink:0;
  }
  .editor-toolbar{display:flex;align-items:center;gap:4px;}
  .editor-toolbar button{
    background:transparent;border:1px solid #30363d;border-radius:4px;
    color:var(--text-muted);font-size:11px;padding:2px 8px;cursor:pointer;
  }
  .editor-toolbar button:hover{color:var(--text-main);background:#21262d;}

  /* Monaco Editor 容器 */
  .editor-body{flex:1;overflow:hidden;position:relative;background:#1e1e1e;}
  #monacoEditor{width:100%;height:100%;}

  /* 右侧高保真画布 */
  .preview-panel{flex:1;background:#181d26;}
  .preview-wrapper{
    flex:1;overflow:auto;background:#181d26;
    display:flex;flex-direction:column;align-items:center;
    padding:24px 16px;position:relative;
  }
  .preview-viewport{
    transform-origin: top center;
    transition: transform 0.15s cubic-bezier(0.2,0,0,1);
    display:flex;flex-direction:column;align-items:center;
  }
  .preview-container{
    position:relative;width:210mm;background:#fff;border-radius:6px;
    box-shadow:0 12px 48px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.3);
  }
  .preview-container iframe{
    width:210mm;min-height:297mm;border:none;border-radius:6px;display:block;
  }

  /* 多页 A4 分页截断标线容器 */
  .page-guides-container{
    position:absolute;top:0;left:0;right:0;bottom:0;
    pointer-events:none;z-index:10;
  }
  .page-guide-line{
    position:absolute;left:0;right:0;
    height:0;border-top:2px dashed rgba(248,81,73,0.7);
    display:flex;justify-content:space-between;align-items:center;
  }
  .page-guide-tag{
    background:rgba(248,81,73,0.9);color:#fff;font-size:10px;font-weight:700;
    padding:2px 8px;border-radius:0 0 4px 0;letter-spacing:.3px;
  }
  .page-guide-warn{
    background:rgba(210,153,34,0.9);color:#fff;font-size:10px;font-weight:600;
    padding:2px 8px;border-radius:0 0 0 4px;
  }

  /* 遮罩层 (移动端展开侧边栏时使用) */
  .sidebar-backdrop{
    position:fixed;top:44px;left:0;right:0;bottom:26px;
    background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);
    z-index:35;display:none;opacity:0;transition:opacity .2s ease;
  }
  .sidebar-backdrop.show{display:block;opacity:1;}

  /* ---------- 移动端自适应响应式规则 (Mobile / Tablet Responsive) ---------- */
  @media (max-width: 768px) {
    .topbar{padding:0 8px;height:42px;}
    .topbar-logo span, .save-status{display:none;}
    .doc-badge{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .btn{padding:3px 8px;font-size:11.5px;}

    /* 移动端侧边栏作为浮层抽屉 (Drawer) */
    .sidebar{
      position:fixed;top:44px;left:48px;bottom:26px;
      height:calc(100vh - 70px);z-index:38;
      box-shadow:8px 0 32px rgba(0,0,0,0.6);
      width:280px !important;
      transform:translateX(0);transition:transform .22s cubic-bezier(0.2,0,0,1);
    }
    .sidebar.collapsed{
      transform:translateX(-120%);
      width:280px !important;
    }

    /* 移动端主工作区：上下排列或通过 Tab 切换 */
    .workspace{flex-direction:column;}
    .editor-panel{width:100% !important;height:50% !important;border-right:none;border-bottom:1px solid var(--border-color);}
    .preview-panel{width:100% !important;height:50% !important;}
    .preview-wrapper{padding:12px 6px;}

    .statusbar-right .status-item:last-child{display:none;}
  }
  .zoom-btn{
    background:none;border:none;color:var(--text-muted);font-size:11px;
    cursor:pointer;padding:1px 6px;border-radius:4px;
  }
  .zoom-btn:hover{color:var(--text-main);background:#21262d;}
  .zoom-text{font-size:11px;color:var(--text-main);min-width:38px;text-align:center;font-family:ui-monospace,monospace;}

  /* ---------- 3. 底部状态栏 (Status Bar: 26px) ---------- */
  .statusbar{
    height:26px;background:var(--statusbar-bg);border-top:1px solid var(--border-color);
    display:flex;align-items:center;justify-content:space-between;padding:0 12px;
    font-size:11.5px;color:var(--text-muted);flex-shrink:0;z-index:50;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .statusbar-left, .statusbar-right{display:flex;align-items:center;gap:14px;}
  .status-item{display:flex;align-items:center;gap:4px;cursor:pointer;}
  .status-item:hover{color:var(--text-main);}

  /* ---------- 4. 登录浮层 Modal ---------- */
  .login-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(10,12,16,0.85);backdrop-filter:blur(12px);
    display:flex;align-items:center;justify-content:center;
    z-index:999;
  }
  .login-card{
    background:var(--panel-dark);border:1px solid var(--border-color);border-radius:14px;
    padding:32px 28px;width:350px;max-width:90vw;
    box-shadow:0 20px 50px rgba(0,0,0,0.6);
    display:flex;flex-direction:column;gap:16px;
  }
  .login-card h2{font-size:18px;font-weight:700;text-align:center;}
  .login-card h2 b{color:var(--accent-green);}
  .login-card .field{display:flex;flex-direction:column;gap:6px;}
  .login-card .field label{font-size:12px;color:var(--text-muted);font-weight:600;}
  .login-card .field input{
    background:#0d1117;border:1px solid var(--border-color);border-radius:6px;
    padding:9px 12px;color:var(--text-main);font-size:13px;outline:none;
  }
  .login-card .field input:focus{border-color:var(--accent-blue);}
  .login-card button.btn-login{
    background:var(--accent-green);color:#0f1117;border:none;border-radius:6px;
    padding:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;
  }
  .login-card button.btn-login:hover{filter:brightness(1.1);}
  .login-err{font-size:12px;color:var(--danger);text-align:center;display:none;}

  /* 提示条 */
  .toast{
    position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1c2230;color:var(--text-main);padding:8px 16px;border-radius:8px;
    border:1px solid var(--border-color);font-size:12.5px;opacity:0;transition:all .2s;z-index:1000;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.error{border-color:var(--danger);color:#ffa198;}
</style>
</head>
<body>

  <!-- 登录浮层 -->
  <div id="loginModal" class="login-overlay" style="display:flex;">
    <div class="login-card">
      <div style="display:flex;justify-content:center;margin-bottom:4px;">
        <img src="/static/logo.svg?v=0.1.4" style="width:48px;height:48px;" alt="Logo">
      </div>
      <h2>Resume<b>Craft</b> 简历工坊</h2>
      <div class="field">
        <label>管理员账号</label>
        <input type="text" id="loginUser" placeholder="admin" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div id="loginErrMsg" class="login-err"></div>
      <button class="btn-login" id="btnLogin" onclick="doLogin()">登 录</button>
    </div>
  </div>

  <!-- 1. 极简交付顶栏 -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">
        <img src="/static/logo.svg?v=0.1.4" alt="Logo">
        <span>Resume<b>Craft</b></span>
      </span>
      <span id="currentDocLabel" class="doc-badge">example.md</span>
      <span class="save-status" id="saveStatus"><span class="dot"></span> 自动已暂存</span>
    </div>

    <div class="topbar-right">
      <button class="btn" id="btnSaveDoc" title="保存到云端 (Ctrl+S)">💾 保存</button>
      <button class="btn" id="btnViewInsight" title="在新页面全屏展示 (独立无干扰链接)">👁 全屏沉浸 ↗</button>
      <button class="btn" id="btnPublicPage" title="打开免登录公开个人主页 (简历名片)">🌐 个人主页 ↗</button>
      <button class="btn" id="btnExportGitData" title="导出 Git 贡献日历数据 (JSON)">📊 导出 Git 数据</button>
      <button class="btn primary" id="btnExport" title="导出高保真 PDF">📄 导出 PDF</button>
      <button class="btn" id="btnLogout" style="padding:4px 8px;" title="退出登录">退出</button>
    </div>
  </div>

  <!-- 2. 主工作区架构 (Activity Bar + Sidebar + Studio) -->
  <div class="workbench">
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
    
    <!-- 2.1 活动栏 (48px) -->
    <div class="activity-bar">
      <button class="act-item active" id="tabDoc" title="简历文档库 (Ctrl+B)">📄</button>
      <button class="act-item" id="tabPages" title="🖥️ HTML 页面托管 (个人炫技主页 / 项目展示)">🖥️</button>
      <button class="act-item" id="tabMetrics" title="⚡ 多平台真实数据源与量化指标">⚡</button>
      <button class="act-item" id="tabTheme" title="🎨 排版模板与主题风格">🎨</button>
    </div>

    <!-- 2.2 统一多功能侧边栏 (320px) -->
    <div class="sidebar" id="sidebar">
      
      <!-- Panel 1: 简历文档库 -->
      <div id="panelDoc" style="display:flex;flex-direction:column;height:100%;">
        <div class="sidebar-head">
          <h3>📂 简历文档库</h3>
          <button id="btnNewDoc" style="background:var(--accent-green);color:#0f1117;border:none;border-radius:4px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;">+ 新建</button>
        </div>
        <div class="sidebar-body" id="docList"></div>
      </div>

      <!-- Panel 2: 多平台量化指标 -->
      <div id="panelMetrics" style="display:none;flex-direction:column;height:100%;">
        <div class="sidebar-head">
          <h3>⚡ 客观量化数据源</h3>
          <button id="btnRefreshMetrics" style="background:#21262d;color:var(--text-main);border:1px solid var(--border-color);border-radius:4px;padding:2px 6px;font-size:11px;cursor:pointer;">⟳ 刷新</button>
        </div>
        <div class="sidebar-body" id="metricsList"></div>
      </div>

      <!-- Panel: HTML 页面托管 -->
      <div id="panelPages" style="display:none;flex-direction:column;height:100%;">
        <div class="sidebar-head">
          <h3>🖥️ HTML 页面托管</h3>
          <button id="btnUploadPage" style="background:var(--accent-green);color:#0f1117;border:none;border-radius:4px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;">上传</button>
          <input type="file" id="pageFileInput" accept=".html,text/html" style="display:none;">
        </div>
        <div class="sidebar-body" id="pagesList"></div>
      </div>

      <!-- Panel 3: 排版模板与主题 -->
      <div id="panelTheme" style="display:none;flex-direction:column;height:100%;">
        <div class="sidebar-head">
          <h3>🎨 模板风格与排版</h3>
        </div>
        <div class="sidebar-body">
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">选择简历呈现模板：</div>
          <select id="tplSel" style="width:100%;padding:8px;background:#161b22;border:1px solid var(--border-color);color:var(--text-main);border-radius:6px;outline:none;font-size:13px;"></select>
          <div style="font-size:11.5px;color:var(--text-muted);margin-top:14px;line-height:1.6;">
            💡 提示：模板修改会双向同步到 Markdown 顶部的 front matter 中。
          </div>
        </div>
      </div>

    </div>

    <!-- 2.3 双栏核心工坊 -->
    <div class="workspace">
      
      <!-- 左：Markdown 编辑器 (VS Code Monaco Editor) -->
      <div class="panel editor-panel">
        <div class="panel-head">
          <span>📝 VS Code Markdown 编辑器</span>
          <div class="editor-toolbar">
            <button id="btnInsertJob">+经历</button>
            <button id="btnInsertProj">+项目</button>
            <button id="btnInsertSkill">+技能</button>
            <button id="btnUploadImage" title="上传形象照">📷 照片</button>
            <input type="file" id="imageFileInput" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif" style="display:none;">
          </div>
        </div>
        <div class="editor-body">
          <div id="monacoEditor"></div>
        </div>
      </div>

      <!-- 右：A4 高保真预览画布 -->
      <div class="panel preview-panel">
        <div class="panel-head">
          <span>👁 A4 实时高保真预览</span>
          <div style="display:flex;align-items:center;gap:8px;">
            <span id="pageStat" style="font-size:11px;color:var(--accent-green);">共 1 页</span>
            <div class="zoom-pill">
              <button class="zoom-btn" id="btnZoomOut">-</button>
              <span class="zoom-text" id="zoomVal">100%</span>
              <button class="zoom-btn" id="btnZoomIn">+</button>
              <button class="zoom-btn" id="btnZoomAuto" style="border-left:1px solid var(--border-color);margin-left:2px;">适应</button>
            </div>
            <button id="btnToggleGuide" style="background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:11px;">📏 截断线: 开</button>
            <button id="btnRefresh" style="background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:11px;">⟳</button>
          </div>
        </div>
        <div class="preview-wrapper" id="previewWrapper">
          <div class="preview-viewport" id="previewViewport">
            <div class="preview-container" id="previewContainer">
              <div class="page-guides-container" id="guidesContainer"></div>
              <iframe id="previewFrame" sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- 3. 底部状态栏 -->
  <div class="statusbar">
    <div class="statusbar-left">
      <span class="status-item" id="btnToggleSidebar" title="折叠/展开侧边栏 (Ctrl+B)">◫ 侧边栏</span>
      <span class="status-item">UTF-8</span>
      <span class="status-item" id="charCount">0 字</span>
    </div>
