<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeCraft · 简历全屏预览</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg?v=0.1.4">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg-workspace:#1e232d;
    --border-color:#30363d;
    --accent-green:#3fb950;
    --text-main:#e6edf3;
    --text-muted:#8b949e;
  }
  body{
    font-family:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg-workspace);color:var(--text-main);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:30px 16px 60px 16px;
  }

  /* 悬浮轻量控制栏 */
  .floating-bar{
    position:fixed;top:16px;right:20px;z-index:999;
    display:flex;align-items:center;gap:8px;
    background:rgba(21,26,34,0.85);backdrop-filter:blur(12px);
    border:1px solid var(--border-color);border-radius:30px;
    padding:6px 14px;box-shadow:0 8px 32px rgba(0,0,0,0.4);
    opacity:0.85;transition:opacity .2s;
  }
  .floating-bar:hover{opacity:1;}
  .floating-bar .doc-title{font-size:12.5px;color:var(--text-main);font-weight:600;margin-right:4px;}
  .floating-bar button, .floating-bar a{
    background:#1c2230;color:var(--text-main);border:1px solid var(--border-color);
    border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;text-decoration:none;transition:all .15s;
  }
  .floating-bar button:hover, .floating-bar a:hover{background:#262c3a;border-color:#484f58;}
  .floating-bar button.primary{background:var(--accent-green);color:#0f1117;border:none;font-weight:700;}
  .floating-bar button.primary:hover{filter:brightness(1.1);}

  /* A4 独立全屏纸张卡片 */
  .viewport{
    display:flex;flex-direction:column;align-items:center;
    width:100%;max-width:100%;margin-top:20px;
  }
  .paper-container{
    position:relative;width:210mm;background:#fff;border-radius:6px;
    box-shadow:0 16px 64px rgba(0,0,0,.55), 0 2px 12px rgba(0,0,0,.25);
  }
  .paper-container iframe{
    width:210mm;min-height:297mm;border:none;border-radius:6px;display:block;
  }

  @media print {
    .floating-bar{display:none !important;}
    body{background:#fff;padding:0;margin:0;}
    .viewport{margin:0;}
    .paper-container{box-shadow:none;}
  }
</style>
</head>
<body>

  <!-- 顶部轻量浮动操作条 -->
  <div class="floating-bar">
    <span class="doc-title" id="docTitle">📄 简历预览</span>
    <button id="btnPrint">🖨 打印</button>
    <button id="btnExport" class="primary">📄 导出 PDF</button>
    <a href="/" id="btnEdit">✏️ 返回编辑</a>
  </div>

  <div class="viewport">
    <div class="paper-container" id="paperContainer">
      <iframe id="previewFrame" sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const docFile = urlParams.get('doc') || 'example.md';
    
    document.getElementById('docTitle').textContent = `📄 ${docFile.replace('.md','')}`;
    document.getElementById('btnEdit').href = `/?doc=${encodeURIComponent(docFile)}`;

    let currentMd = '';
    let lastVersionTag = '';

    async function loadResume(isAutoHotReload = false) {
      try {
        const res = await fetch(`/api/documents/${encodeURIComponent(docFile)}`);
        if (res.status === 401) {
          alert('请先登录系统');
          window.location.href = '/';
          return;
        }
        if (!res.ok) {
          if (!isAutoHotReload) alert('未能加载指定简历');
          return;
        }
        const data = await res.json();
        currentMd = data.content;
        lastVersionTag = data.version_tag || '';

        // 请求渲染预览
        const prevRes = await fetch('/api/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain; charset=utf-8' },
          body: currentMd
        });
        const html = await prevRes.text();
        const frame = document.getElementById('previewFrame');
        
        // 注入当前页面绝对 baseUrl 确保相对图片如 /api/git/chart.svg 能被 iframe 准确加载
        const baseHref = window.location.origin;
        const injectedHtml = html.replace('<head>', `<head><base href="${baseHref}/">`);
        frame.srcdoc = injectedHtml;
        frame.onload = () => {
          try {
            const iframeDoc = frame.contentDocument || frame.contentWindow?.document;
            const pageEl = iframeDoc.querySelector('.page') || iframeDoc.body;
            const computedBg = iframeDoc.defaultView.getComputedStyle(pageEl).backgroundColor;
            if (computedBg && computedBg !== 'transparent') {
              document.getElementById('paperContainer').style.background = computedBg;
            }
            const bodyHeight = Math.max(pageEl.scrollHeight, iframeDoc.body.scrollHeight);
            frame.style.height = Math.max(bodyHeight, 1122) + 'px';
            document.getElementById('paperContainer').style.height = Math.max(bodyHeight, 1122) + 'px';
          } catch(e){}
        };
      } catch (e) {
        console.error('加载失败', e);
      }
    }

    /* 独立全屏视图：热重载与文件版本检测 */
    async function checkViewHotReload() {
      if (!docFile) return;
      try {
        const res = await fetch(`/api/documents/${encodeURIComponent(docFile)}/status`);
        if (!res.ok) return;
        const data = await res.json();
        if (data.ok && data.version_tag) {
          if (!lastVersionTag) {
            lastVersionTag = data.version_tag;
            return;
          }
          if (data.version_tag !== lastVersionTag) {
            lastVersionTag = data.version_tag;
            await loadResume(true);
          }
        }
      } catch(e) {}
    }

    // 焦点恢复立即检测
    window.addEventListener('focus', checkViewHotReload);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkViewHotReload();
    });
    // 空闲轻量轮询检测（每 2.5 秒）
    setInterval(() => {
      if (!document.hidden) checkViewHotReload();
    }, 2500);

    document.getElementById('btnPrint').addEventListener('click', () => {
      document.getElementById('previewFrame').contentWindow.print();
    });

    document.getElementById('btnExport').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/export', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain; charset=utf-8' },
          body: currentMd
        });
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `resume_${encodeURIComponent(docFile.replace('.md',''))}.pdf`;
        a.click();
      } catch(e) {
        alert('导出失败');
      }
    });

    loadResume();
  </script>
</body>
</html>
